<h2>Liste des tickets</h2>
<button [disabled]="isLoading" (click)="createTicket()">
  Nouveau ticket
</button>
<table>

  <thead>
    <tr>
      <th>Titre</th>
      <th>Statut</th>
      <th>Créé le</th>
    </tr>
  </thead>

  <tbody>

    @for (ticket of tickets(); track ticket.id) {

    <tr>

      <td>{{ ticket.title }}</td>

      <td>{{ ticket.statut }}</td>

      <td>{{ ticket.createdAtUtc | date}}</td>

    </tr>

    }

  </tbody>

</table>
